// Classes the Compose compiler should treat as stable.
//
// Everything in :core:theory is immutable by design, but that module is a plain Kotlin
// library compiled without the Compose compiler plugin, so Compose has no stability
// information for it and assumes the worst. Listing the package here restores skipping
// for Composables that take these types as parameters.
//
// Only add types here that are genuinely immutable — a wrong entry causes stale UI, not a
// compile error.
com.example.notolyzard.core.theory.*
